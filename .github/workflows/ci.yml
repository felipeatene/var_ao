name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web build and typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Upload web preview artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Mobile analyze and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: ./scripts/mobile.sh --version

      - name: Install mobile dependencies
        run: ./scripts/mobile.sh pub get

      - name: Analyze mobile app
        run: ./scripts/mobile.sh analyze

      - name: Run mobile tests
        run: ./scripts/mobile.sh test --no-pub
