name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Validate Pages build
        run: |
          set -euo pipefail
          test -f dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references /src/main.tsx (source HTML, not the Vite bundle)"
            exit 1
          fi
          if ! grep -Eq '(src|href)="/var_ao/assets/[^"]+\.js"' dist/index.html; then
            echo "::error::dist/index.html does not reference compiled assets under /var_ao/assets/"
            exit 1
          fi
          if grep -Eo '(src|href)="/[^"]*"' dist/index.html | grep -v '="/var_ao/'; then
            echo "::error::dist/index.html has root-relative URLs outside /var_ao/"
            exit 1
          fi
          test -f dist/assets/court.png
          echo "dist/index.html references:"
          grep -Eo '(src|href)="[^"]*"' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
